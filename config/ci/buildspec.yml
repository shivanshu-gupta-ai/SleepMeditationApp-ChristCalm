version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
  pre_build:
    commands:
      - echo "Unpacking backend source..."
      - mkdir -p backend package
      - tar -xzf backend.tar.gz -C backend
  build:
    commands:
      - pip install -r backend/requirements-lambda.txt -t package/ --quiet
      - cp backend/handler.py backend/server.py backend/seed_data.py package/
      - cp -r backend/api backend/auth backend/ai backend/core backend/data package/
      - echo "AI corpus check:" && find backend/ai -type f -name '*.md' | head -20
      - test -f package/ai/corpus/Wisdom_Handbook.md || (echo "MISSING ai corpus handbook" && ls -laR backend/ai | head -50 && exit 1)
      # Drop macOS AppleDouble / junk that can pollute RAG corpus
      - find package -name '._*' -delete 2>/dev/null || true
      - find package -name '.DS_Store' -delete 2>/dev/null || true
      - cd $CODEBUILD_SRC_DIR/package && zip -r $CODEBUILD_SRC_DIR/lambda.zip . -x '*.pyc' -x '*/__pycache__/*' -x '*/._*' -x '*/.DS_Store'
  post_build:
    commands:
      - ls -lah $CODEBUILD_SRC_DIR/lambda.zip
      - aws lambda update-function-code --function-name $LAMBDA_FUNCTION_NAME --zip-file fileb://$CODEBUILD_SRC_DIR/lambda.zip
      - aws lambda wait function-updated --function-name $LAMBDA_FUNCTION_NAME
      - echo "Lambda deployed successfully"
