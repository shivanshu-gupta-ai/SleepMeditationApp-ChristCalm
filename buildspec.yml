version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
  pre_build:
    commands:
      - echo "Unpacking backend source..."
      - mkdir -p backend package
      - tar -xzf backend.tar.gz -C backend
  build:
    commands:
      - pip install -r backend/requirements-lambda.txt -t package/ --quiet
      - cp backend/handler.py backend/server.py backend/seed_data.py package/
      - cp -r backend/services package/
      - echo "Wisdom corpus in source:" && find backend -type d -name wisdom -o -name '*.md' | head -40
      - mkdir -p package/wisdom
      - if [ -d backend/wisdom ]; then cp -R backend/wisdom/. package/wisdom/; fi
      - ls -la package/wisdom/ || true
      - test -f package/wisdom/Wisdom_Handbook.md || (echo "MISSING wisdom handbook" && ls -laR backend | head -50 && exit 1)
      - cd $CODEBUILD_SRC_DIR/package && zip -r $CODEBUILD_SRC_DIR/lambda.zip . -x '*.pyc' -x '*/__pycache__/*'
  post_build:
    commands:
      - ls -lah $CODEBUILD_SRC_DIR/lambda.zip
      - aws lambda update-function-code --function-name $LAMBDA_FUNCTION_NAME --zip-file fileb://$CODEBUILD_SRC_DIR/lambda.zip
      - aws lambda wait function-updated --function-name $LAMBDA_FUNCTION_NAME
      - echo "Lambda deployed successfully"