name: Deploy Serverless API

on:
  push:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pin third-party actions to full commit SHAs (mutable tags are RCE risk).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-lambda.txt pytest requests python-dotenv
      - name: Import check
        env:
          JWT_SECRET: test
          STRIPE_API_KEY: sk_test_x
          AWS_REGION: us-east-1
          DYNAMODB_TABLE_PREFIX: christcalm-preview
        run: python -c "from handler import handler; print('OK')"
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: aws sts get-caller-identity

      - name: Deploy via AWS CodeBuild
        run: ./scripts/deploy-aws.sh code